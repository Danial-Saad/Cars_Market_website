<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CarHub</title>
    <link rel="icon" type="image/png" href="/static/assets/favicon.png">
    <link rel="apple-touch-icon" href="/static/assets/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <div class="auth-shell">
        <div>
            <a href="/cars" class="auth-brand" style="display:block;">
                <img src="/static/assets/logo-header.png" alt="CarHub">
            </a>

            <div class="login-container">
                <h1 class="title">Welcome back</h1>
                <p class="subtitle">Log in to find your perfect ride</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert {{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form action="/login" method="POST" class="login-form">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <div class="options">
                        <label><input type="checkbox"> Remember Me</label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn">Login</button>

                    <p class="register-link">
                        Don't have an account? <a href="/register">Register here</a>
                    </p>
                </form>
            </div>
            <a href="/cars" class="back-home">← Back to browsing</a>
        </div>
    </div>
</body>
</html>
